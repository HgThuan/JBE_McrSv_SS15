server:
  port: 8088

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: course-service
          uri: http://${COURSE_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/api/courses/**
        - id: identity-service
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/auth/**

